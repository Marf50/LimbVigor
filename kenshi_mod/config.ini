# Limb Vigor — drop this folder into Kenshi/mods/LimbVigor/
# Rates are per in-game hour (~53.3 real seconds at 1x).

EnableHooks=1
# Medical STATS panel (the list with Blood). Turn off only if that panel crashes.
EnableHud=1
# Character::say is unsafe (VS2010 strings). Leave off. Messages go to the panel + RE_Kenshi_log.txt.
EnableSpeech=0
DebugLog=1

max_vigor=100

